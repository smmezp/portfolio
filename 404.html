<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Medeiros</title>
  <meta name="robots" content="noindex">
  <script>
    /*
     * O GitHub Pages não conhece as rotas da SPA (/discord, /contact...).
     * Guardamos o endereço pedido e voltamos ao index.html, que o restaura.
     */
    (() => {
      const segments = location.pathname.split('/').filter(Boolean);
      const base = location.hostname.endsWith('.github.io') && segments.length ? `/${segments[0]}/` : '/';
      try { sessionStorage.setItem('medeiros-redirect', location.pathname + location.search + location.hash); } catch (error) { /* sem armazenamento */ }
      location.replace(base);
    })();
  </script>
</head>
<body></body>
</html>
