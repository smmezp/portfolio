  <script>
    (() => {
      const base = document.createElement('base');
      const pathSegments = window.location.pathname.split('/').filter(Boolean);
      const isGitHubPagesProject = window.location.hostname.endsWith('.github.io') && pathSegments.length;
      base.href = window.location.protocol === 'file:' ? './' : (isGitHubPagesProject ? `/${pathSegments[0]}/` : '/');
      document.head.appendChild(base);
    })();
  </script>

        document.documentElement.lang = localStorage.getItem('medeiros-lang') === 'en' ? 'en' : 'pt-BR';
